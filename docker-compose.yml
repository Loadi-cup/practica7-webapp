services:
  web:
    build: .
    container_name: php-practica7
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mysql-practica7
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: practica7
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
